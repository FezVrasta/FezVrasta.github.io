<style>
  html { background: #f1e7d2; }
  html.dark { background: #140f0b; }
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('te-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === 'dark') document.documentElement.className = 'dark';
    location.replace('https://fezvrasta.github.io/TimberEmpires-Docs/' + location.search + location.hash);
  })();
</script>
</head>
